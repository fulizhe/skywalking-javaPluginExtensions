name: Build and Test OAP Mock Starter (JDK 17)

on:
  push:
    branches:
      - master
    paths:
      - 'oap/skywalking-oap-mock-spring-boot-starter/**'
      - '.github/workflows/oap-build-and-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'oap/skywalking-oap-mock-spring-boot-starter/**'
      - '.github/workflows/oap-build-and-test.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test OAP mock starter
        working-directory: ./oap/skywalking-oap-mock-spring-boot-starter
        run: mvn -B install

      - name: Build demo app
        working-directory: ./oap/skywalking-oap-mock-spring-boot-starter/demo
        run: mvn -B package
