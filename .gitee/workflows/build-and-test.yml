name: Build and Test Active Plugins (JDK 17)

# Gitee 镜像：与 .github/workflows/build-and-test.yml 同义（同一套 actions 语法，
# 沿用 master 的 .gitee 镜像写法 —— @v4 动作、ubuntu-latest、不带 maven 缓存）。
# 注意分支过滤指向本线：workflow 从**被推送的那个 ref 的树里**读，沿用 master 那份的
# branches:[master] 在本线推送时不会触发（同 .github 那份的说明）。
on:
  push:
    branches:
      - release/1.0.0
    paths:
      - 'agent/logfile-reporter-plugin/**'
      - 'agent/override-httpclient-4.x-plugin/**'
      - 'agent/override-hutool-http-5.x-plugin/**'
      - 'agent/dynamic-debug-runtime-9.x-plugin/**'
      - 'agent/pom.xml'
      # 带自身路径:否则改这个 workflow 永远不触发它自己(同 .github 那份)
      - '.gitee/workflows/build-and-test.yml'
  pull_request:
    branches:
      - release/1.0.0
    paths:
      - 'agent/logfile-reporter-plugin/**'
      - 'agent/override-httpclient-4.x-plugin/**'
      - 'agent/override-hutool-http-5.x-plugin/**'
      - 'agent/dynamic-debug-runtime-9.x-plugin/**'
      - 'agent/pom.xml'
      - '.gitee/workflows/build-and-test.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test active plugins (release 8 bytecode)
        working-directory: ./agent
        run: mvn -B test -pl logfile-reporter-plugin,override-httpclient-4.x-plugin,override-hutool-http-5.x-plugin,dynamic-debug-runtime-9.x-plugin -am
