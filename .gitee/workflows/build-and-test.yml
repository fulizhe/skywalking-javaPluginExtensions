name: Build and Test Active Plugins (JDK 17)

on:
  push:
    branches:
      - master
    paths:
      - 'agent/logfile-reporter-plugin/**'
      - 'agent/override-httpclient-4.x-plugin/**'
      - 'agent/override-httpclient-5.x-plugin/**'
      - 'agent/override-hutool-http-5.x-plugin/**'
      - 'agent/dynamic-debug-runtime-9.x-plugin/**'
      - 'agent/pom.xml'
      # 带自身路径:否则改这个 workflow 永远不触发它自己(同 .github 那份)
      - '.gitee/workflows/build-and-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'agent/logfile-reporter-plugin/**'
      - 'agent/override-httpclient-4.x-plugin/**'
      - 'agent/override-httpclient-5.x-plugin/**'
      - 'agent/override-hutool-http-5.x-plugin/**'
      - 'agent/dynamic-debug-runtime-9.x-plugin/**'
      - 'agent/pom.xml'
      - '.gitee/workflows/build-and-test.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test active plugins (release 8 bytecode)
        working-directory: ./agent
        run: mvn -B test -pl logfile-reporter-plugin,override-httpclient-4.x-plugin,override-httpclient-5.x-plugin,override-hutool-http-5.x-plugin,dynamic-debug-runtime-9.x-plugin -am
