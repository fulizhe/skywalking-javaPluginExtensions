# 本地浏览 / 持续压测编排:demo-app(带 agent 常驻)+ stress(无限循环压测,可选)。
#
# 【只想在浏览器里看插件效果】——不需要压测,stress 收在 profile 里,默认不起:
#   docker compose up --build -d demo-app
#   浏览器打开 http://127.0.0.1:9600/                     (能力导览首页)
#              http://127.0.0.1:9600/dashboards/index.html (各仪表盘;注意必须带 index.html)
#   docker compose down
#
# ⚠ 仪表盘入口是 /dashboards/index.html,不是 /dashboards/——后者 404,
#   而 404 会被插件判为错误并真的发一条 ERROR 告警,凭空多出一条假事件。
#
# 【要压测观测插件长跑稳定性】——显式带上 stress profile(常规档,冲高 QPS):
#   docker compose --profile stress up --build -d
#   docker compose logs -f stress        # 每 10s 一行 [progress]:吞吐 + plugin 计数 + heap
#   docker compose down                  # 停止并删除容器(volume 保留)
#
# 【要核对指标准确性】——用 stress-slow profile(慢接口档,每端点耗时已知故有真值可对):
#   docker compose --profile stress-slow up --build stress-slow      # 打完即退,不 up -d
#   docker compose logs stress-slow
#   浏览器打开 http://127.0.0.1:9600/dashboards/metrics.html 与 slow-topn.html 对照:
#     ⚠️ 下表第一列是**指标里记录的端点名**(Spring 会把路径参数模板化成 {id}),
#        与压测实际打的 URL 可能不同;第二列是**服务端**耗时(不含客户端/建连开销)。
#     GET:/api/order/{id}                        8.5s  → P50 应在 8s 量级(容器内实测 8.50s)
#     GET:/api/trace-alert-demo/slow?ms=4000     4.0s  → P50 应在 4s 量级(实测 4.00s)
#     GET:/api/export/report?ms={rand:1000,4000}       → P50≈2.5s(实测 2.37s)、P95 接近 4s
#     GET:/debug                                 2.6s  → 随机(RandomUtil.randomLong(2000) + profile2 递归;实测 2.57s)
#     GET:/longTimeTask                          1.1s  → **随机 200~2000ms**,median≈1.1s(实测 0.99s)
#     GET:/api/deps-demo/grpc                    0.03s → **毫秒级**:与上面几条拉开两个数量级
#     (旧注释写 /debug 3.1s、/longTimeTask"固定 1.5s"、grpc 0.3s —— 那是 Windows 上一次
#      性 curl 测得的值,含 JIT/类加载开销,/longTimeTask 则是改成随机后没跟。以代码与
#      容器内实测为准。)
#   ⚠️ 两档**互斥,不要一起起**:慢端点档 req/s 天花板约 1~2,会把常规档的吞吐压垮。
#      精确核对命令(Windows/Linux 都可用):
#        curl "http://127.0.0.1:9600/inner/sw/metrics/query?aggregate=true&fromBucket=<分钟桶>&toBucket=<分钟桶>&resolution=min"
#   ⚠️ 分位是**按请求数加权平均的近似值**(≤24h 走分钟分位),所以小样本下与端点
#      真实耗时会差一截 —— 先确认 bucketCount 够大再判"不准"。
#
# 【想看依赖拓扑图的"分层"】——显式带上 deps profile,起 Redis / MySQL / Kafka:
#   docker compose --profile deps up --build -d
#   造数(每条至少点一次,让依赖边出现):
#     curl "http://127.0.0.1:9600/api/deps-demo/redis?op=set"
#     curl "http://127.0.0.1:9600/api/deps-demo/mysql?sleepMs=300"
#     curl "http://127.0.0.1:9600/api/deps-demo/kafka?op=produce"
#     curl "http://127.0.0.1:9600/api/deps-demo/http?site=httpbin"
#   一条命令打齐四层: curl "http://127.0.0.1:9600/api/deps-demo/all"
#   全貌入口(每种被监控的组件各一次): curl "http://127.0.0.1:9600/fullSample"
#   浏览器打开 http://127.0.0.1:9600/dashboards/topology.html
#
# 不带 deps profile 时 demo-app **照调**这三个依赖,但结果分两种(**都不是"红边"**):
#   - Cache / Database(Redis / MySQL):连接都没建起来 → **不产生依赖边**,图上这两个组件**缺席**。
#     缺席**不能**读成"没有这个调用"(确认请看链路视图)。
#   - MQ / 外呼(Kafka / HTTP):调用本身被观测到 → **有边**,但 errorCount 可能仍是 0
#     (Kafka 在 broker 不可达时 send() 等满 max.block.ms 抛超时,而 agent 的 producer span
#      靠异步 callback 回填错误、同步超时没有 callback —— 判成功 ≠ 调用真的成功)。
# 所以没起中间件也能验证"组件识别",只是 Cache/Database 两层要在起中间件后才看得见。
# 外网可达性取决于宿主网络:baidu / google 不通同样表现为无边或失败边,属预期,不是故障。
#
# 观测点:stress 日志里 plugin= 段(rowsUpserted/lateDropped/sampleOverflow/
# endpointOverflow/persistErrors/aggregateErrors)是否异常增长、heap= 是否持续攀升;
# demo-app 侧另见 docker compose logs -f demo-app 与 /opt/skywalking-agent/logs/。
name: demo-app-stability

services:
  demo-app:
    build:
      context: ../..
      dockerfile: agent/demo-app/Dockerfile
    image: demo-app-agent:9.4.0
    restart: unless-stopped
    ports:
      - "9600:9600"
      # 额外的 H2 Web Console(插件内置,见下方 h2.console_enabled):
      # 直接浏览插件 H2 影子库 sw_trace_segment,与 /inner/sw/trace-* JSON 读口、
      # 内存热层对照排查。登录 JDBC URL: jdbc:h2:mem:sw_trace_segment;DB_CLOSE_DELAY=-1
      # 用户 sa / 空密码。
      - "8092:8092"
    environment:
      WebPort: "9600"
      # deps profile 的中间件地址:容器内用 compose 服务名。
      # 只有 deps profile 起着时这些服务名才解析得到;不起时 → Cache/Database 两层**没有依赖边**
      # (连接未建立不产生出口 span),MQ/外呼仍有边 —— 见文件头说明,不是"红边"。
      # MySQL 的超时参数必须在 URL 上,配置侧已带。
      DEPS_REDIS_HOST: redis
      # ★ 必须显式给端口: application.yml 的默认值是**宿主映射端口 16379**(为"应用跑在宿主、
      #   deps 跑在 compose"设计的),容器内 redis 实际在 6379。少了这行会连 redis:16379。
      DEPS_REDIS_PORT: "6379"
      DEPS_MYSQL_URL: "jdbc:mysql://mysql:3306/demo?connectTimeout=2000&socketTimeout=3000"
      DEPS_MYSQL_USER: demo
      DEPS_MYSQL_PASSWORD: demo
      DEPS_KAFKA_BOOTSTRAP: "kafka:9092"
    # 默认开 Trace 告警:告警是本插件最直观的可见效果(慢/错请求 → webhook 回打本机 →
    # 仪表盘"Trace 告警"面板出现事件),默认关会让首次访问的人误以为功能坏了。
    # 纯指标长跑时删掉下面两行 alert 参数即可(见 NOTES-docker-stress.md)。
    command:
      - java
      # -Xms 刻意给 128m 而非 512m: 实测堆 used 只有 ~42MB, 而 -Xms512m 会**启动即提交**
      # 491MB 常驻, 纯占 RSS。上限仍固定 512m(-Xmx), "堆可见、趋势可观察"的意图不变。
      - -Xms128m
      - -Xmx512m
      - -javaagent:/opt/skywalking-agent/skywalking-agent.jar
      - -Dskywalking.agent.keep_tracing=true
      - -Dskywalking.plugin.logfilereporter.h2.enabled=true
      # 额外的 H2 Web Console(默认关闭):http://127.0.0.1:8092 浏览 sw_trace_segment
      - -Dskywalking.plugin.logfilereporter.h2.console_enabled=true
      - -Dskywalking.plugin.logfilereporter.h2.console_port=8092
      - -Dskywalking.plugin.logfilereporter.metrics.enabled=true
      - -Dskywalking.plugin.logfilereporter.alert.enabled=true
      - -Dskywalking.plugin.logfilereporter.alert.slow_rules=operation:GET:/api/order/*=8000
      - -jar
      - /opt/demo-app/target/demo-app-1.0.0.jar
    # ★ 实测: 固定 512m 堆 + ~440MB native(126 线程栈 / netty / agent 字节码) 下, RSS 稳定在
    #   ~960MB 且不增长(采样 105s 波动 <1MB, 非泄漏) —— 旧的 1g 只剩 ~60MB 余量, 32 线程压测
    #   (5860 rps) 的瞬时尖峰即触发 cgroup OOM 重启(实测两次, 10:44 与 11:20, 每次归零内存 H2)。
    #   给到 2g, 与 stress / stress-slow 对齐; 主机 128G, 余量充足。
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9600/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    # ★ 长期跑必须有日志轮转:docker 的 json-file **默认无上限**,不加这段,
    #   跑几天就把磁盘写满(日志在磁盘上,不在 mem_limit 里,OOM 也拦不住)。
    #   stress / stress-slow 两个压测容器各自也有同款限制(它们的量级更大,各 10m×5)。
    #   这里给到 50m×5 = 250MB:比压测容器宽,是因为**被观察对象就是它** ——
    #   agent 日志(skywalking-agent.log / skywalking-api.log)与异常现场都在这里,
    #   诊断长时间跑出的问题时那几行日志往往就是唯一线索,轮转太快会被冲掉。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ---- deps profile:依赖拓扑演示用的三层中间件(默认不起,见文件头) ----
  # 远端(108)会起本 profile, 但 `deploy_remote.py` 默认**剥掉这三个服务的宿主端口映射**
  # (它们只给 compose 内网用; demo-app 经 DEPS_* 环境变量按服务名访问)。
  # 需要在本机/宿主上用 redis-cli 之类调试时, 才给部署命令加 `--deps-ports`。

  redis:
    # Cache 层:jedis 3.8.x → agent jedis-2.x-3.x 插件;组件名 Jedis(组件库已收录)
    profiles: ["deps"]
    # 用 redis:7 而不是 7-alpine:alpine 变体在部分镜像源/代理下更容易拉失败,
    # 而演示对镜像体积不敏感(差 30MB)。
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 映射到宿主机只为现场用 redis-cli 看 / 给**本机**跑的应用用;
      # compose 内的 demo-app 容器走服务名 redis:6379(与映射无关)。
      # 宿主端口选 16379:本机常被其它栈(如 RuoYi 的 redis)占着 6379。
      # 本机跑应用时对应 DEPS_REDIS_PORT=16379(默认值已写进 application.yml,一般不用设)。
      - "16379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    # Database 层:mysql-connector-java 8.0.x → agent mysql-8.x 插件。
    # **不建表、不挂 init sql**:DepsDemoController 只 SELECT 1 / SLEEP(?),
    # 省掉初始化脚本与数据卷,起来即可用。
    profiles: ["deps"]
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: demo
      # ★ 官方 mysql 镜像**只在同时给了 MYSQL_USER + MYSQL_PASSWORD 时才建用户**并授权到
      #   MYSQL_DATABASE。只给 MYSQL_DATABASE 的话库里只有 root(空密码),而 demo-app 侧配的是
      #   DEPS_MYSQL_USER/PASSWORD=demo/demo → 会 "Access denied for user 'demo'"。
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      # 同样避开宿主 3306(常被 RuoYi 的 mysql 占用);本机跑应用用 DEPS_MYSQL_URL 里的 13306
      - "13306:3306"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    # MQ 层:kafka-clients 2.8.x → agent kafka-0.11.x/1.x/2.x 插件;KRaft 单节点,
    # 不配 ZooKeeper。首次 produce 时由 DepsDemoController 的 AdminClient 建 topic。
    profiles: ["deps"]
    # 用 apache/kafka 官方镜像而不是 bitnami/kafka:Bitnami 改了分发策略(大部分镜像迁到
    # bitnamilegacy),国内镜像源上 bitnami/kafka:3.6 直接 403 Forbidden,拉不下来。
    # 官方镜像的 env 命名没有 KAFKA_CFG_ 前缀,见下。
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 单节点必须为 1,否则 __consumer_offsets / 事务日志 建不出来
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "sw-demo-cluster-0"   # KRaft 必需:官方镜像用它格式化存储目录
    ports:
      # 同理避开宿主 9092;本机跑应用用 DEPS_KAFKA_BOOTSTRAP=localhost:19092
      - "19092:9092"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---- 压测分两档,各收在独立 profile:**本地手动核对时别一起起**(目标互斥,详见各服务注释)----
  #
  #   stress       = 常规压测 → **冲高 QPS + 看长跑稳定性**(堆、插件自身计数)
  #   stress-slow  = 慢接口压测 → **核对指标准确性**(分位/慢率是否落在已知耗时上)
  #
  # 两档的分工与 Windows 侧 `scripts/stress.ps1` 的档位一一对应,路径集与线程数都取自
  # 那边 2026-10-02 的本机实测值;`scripts/stress-slow.ps1` 是慢端点那一份。两处保持一致,
  # 免得"同一台机器/container 里两套数字对不上"。
  # ⚠️ 别拿两档的 req/s 互比 —— 压的不是同一批端点,天花板由最慢那条 / 5xx 占比决定。
  #
  # 【远端压力机(108)是有意让两档并存的】`deploy_remote.py --stress-slow-interval 420`
  #   会把 `stress-slow` 包成"跑一轮 + 间隔 7min"的循环(约 10min 一轮),于是 108 上
  #   stress 常驻冲高、stress-slow 周期性补一批慢样本,大屏上慢端点的分位便可持续核对。
  #   代价:慢档混进来后大盘的全局 P50/P95 与"慢调用"占比会包含慢端点,不再是纯 ms 级口径;
  #   一轮(240 请求/4 线程)本身约 3.3min,周期必须大于一轮时长。

  stress:
    # ★ 常规压测档 = `stress.ps1 -MaxRps` 的路径集:**只 ms 级、只 2xx**。
    #   收在可选 profile 里:默认 `docker compose up` 不启动它(首次只想看效果的人
    #   不该被无限压测的日志与内存占用淹没)。
    profiles: ["stress"]
    image: demo-app-agent:9.4.0
    restart: unless-stopped
    depends_on:
      demo-app:
        condition: service_healthy
    # 压测容器历史上因 "maven JVM + surefire fork 都无堆上限(JDK8 不识别 cgroup)" 而
    # 被 cgroup OOM 周期杀掉、restart 循环(实测 RestartCount 数百)。这里显式封顶两处堆:
    #   MAVEN_OPTS 限 maven 自身;-DargLine 限 surefire fork(= HttpLoadTest 那个 JVM)。
    # 并留足 mem_limit,使无限压测(durationSec=-1)不再因内存被杀。
    environment:
      MAVEN_OPTS: "-Xmx256m"
    volumes:
      - m2-cache:/root/.m2
      # 与镜像构建时同一份 mirror 配置,复用 /root/.m2 预热缓存,避免首跑重复下载
      - ../settings.xml:/opt/demo-app/settings.xml:ro
    command:
      - mvn
      - -s
      - /opt/demo-app/settings.xml
      - -f
      - /opt/demo-app/pom.xml
      - test
      - -Dtest=HttpLoadTest
      - -Dloadtest=true
      - -Dloadtest.baseUrl=http://demo-app:9600
      - -Dloadtest.durationSec=-1
      # 32 线程 = `stress.ps1 -MaxRps` 的推荐值(本机实测甜点区:16 线程约 1280 RPS,
      # 32 线程服务端嵌入式 Tomcat 开始成为瓶颈,再往上收益很小)。
      - -Dloadtest.threads=32
      - -Dloadtest.progressSec=10
      # ★ 只 ms 级、只 2xx —— 两处刻意的"不含"才是这一档能冲上限的原因:
      #   · 不含 /longTimeTask(随机 200~2000ms,median≈1.1s):留着它上限会掉到约 50 RPS,
      #     压出来的是"等慢端点"而不是吞吐(Windows 侧 -NormalOnly 就吃了这个亏)。
      #   · 不含 /fullSample?deps=false:它自身只 4.5ms,但内部会自调一次
      #     /api/trace-alert-demo/ok —— 每个业务请求变成两个 HTTP 往返,
      #     压出来的是"回环放大"的吞吐,不是应用吞吐。
      #   · 不含 5xx:5xx 响应带 Connection: close(Tomcat 协议层行为,8 个码),
      #     每个泄漏一条 TCP 连接;容器 network namespace 的端口池虽比 Windows 宿主宽裕得多,
      #     但长时间 `-durationSec=-1` 仍不该靠运气。顺带也没有告警自环,
      #     persistErrors/aggregateErrors 计数与堆趋势才干净可读。
      - -Dloadtest.paths=/hello,/queryDbByMybatis,/queryDbByJdbc,/statisticJVM,/statisticLogs
      - -DargLine=-Xmx512m
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  stress-slow:
    # ★ 慢接口档 = `scripts/stress-slow.ps1` 的路径集,目的是**核对指标准确性**:
    #   这些端点的耗时是**已知的**(下表给了实测值),所以面板上的 P50/P95/P99
    #   有真值可对 —— 这是"指标准不准"唯一能验的方式。常规档做不到:ms 级端点的
    #   分位差异淹没在噪声里,压出来也看不出对错。
    #
    #   和常规档**互斥,不要一起起**:本档单请求 1~8.5s,req/s 天花板极低(4 线程约 1~2 req/s),
    #   和 stress 一起跑会把那侧的吞吐数字彻底压垮,两边的观测都失真。
    profiles: ["stress-slow"]
    image: demo-app-agent:9.4.0
    restart: "no"          # 有限请求数,打完就退出 —— "no" 免得 restart 反复重跑
    depends_on:
      demo-app:
        condition: service_healthy
    environment:
      MAVEN_OPTS: "-Xmx256m"
    volumes:
      - m2-cache:/root/.m2
      - ../settings.xml:/opt/demo-app/settings.xml:ro
    command:
      - mvn
      - -s
      - /opt/demo-app/settings.xml
      - -f
      - /opt/demo-app/pom.xml
      - test
      - -Dtest=HttpLoadTest
      - -Dloadtest=true
      - -Dloadtest.baseUrl=http://demo-app:9600
      # 240 次 / 6 端点 = **每端点约 40 个样本**。分位至少要几十个样本才有意义:
      # 25 次(Windows 侧默认值)摊到 6 个端点只剩每端点 4 个,P95 完全是噪声。
      # 想看"数据在积累"的走势就改用 -Dloadtest.durationSec=-1(但那时看不到准确分位)。
      - -Dloadtest.requests=240
      - -Dloadtest.threads=4
      # 30s 而非默认 10s:最慢端点 /api/order/1 睡 8.5s,并发下尾延迟会超过 10s ——
      # 那样会攒出"网络异常"让断言非零退出,而超时在慢端点压测里是预期现象,不是缺陷。
      - -Dloadtest.timeoutMs=30000
      - -Dloadtest.progressSec=10
      # ★ 慢端点清单。**左侧是指标里的端点名,右侧是代码/容器内实测的耗时**:
      #     GET:/api/order/{id}                  8.5s   ← 命中 demo-app 的 /api/order/*=8000 SLOW 规则
      #                                            (压测打的是 /api/order/1,Spring 把路径参数模板化成 {id})
      #     GET:/api/trace-alert-demo/slow?ms=4000  4.0s
      #     GET:/api/export/report?ms={rand:1000,4000}  每请求随机 1~4s,P50≈2.5s
      #     GET:/debug                           2.6s(RandomUtil.randomLong(2000) + profile2 递归)
      #     GET:/longTimeTask                    1.1s(**随机 200~2000ms**,median≈1.1s;不是固定值)
      #     GET:/api/deps-demo/grpc              0.03s(进程内 gRPC,**不依赖中间件**)
      #   ⚠️ 上面这些实测值是**服务端**耗时;`stress-slow.ps1` 头注释里并列的还有一组 Windows
      #      客户端墙钟值(含 JIT 与建连开销,偏高) —— 两处口径已对齐,判"指标准不准"用服务端那组。
      #   · /api/export/report 用 {rand:min,max} 让每请求随机睡 1~4s:一条路径就能压出
      #     **连续的耗时分布**,而写死 3s 只压出一条线。它裸调默认睡 65s,
      #     容器内 timeoutMs=30000 会直接放弃 —— 所以必须带 ms 参数。
      #     (YAML 里值含 `{}` 与 `:`,必须整体加引号)
      #   · 刻意**不含**依赖三层的 redis/mysql/kafka:它们只在 deps profile 里起,
      #     本档单独跑时连接建不起来 → 退化成 connect refused(毫秒级),不是慢端点。
      #     要连依赖面一起压,加 --profile deps 并在末尾追加
      #     ,/api/deps-demo/mysql?sleepMs=30(实测约 3s)。
      #   · 刻意**不含**告警演示端点(/api/trace-alert-demo/error|http500):
      #     5xx 会触发插件 webhook 同步回打本机 → 负载自环,且 Tomcat 对 5xx 强制
      #     Connection: close、每个泄漏一条连接。要压告警链路请另起带 error 的路径集。
      #   · /api/order/1 会真的触发一条 SLOW 告警(这是预期):本档看的是"慢 → 指标 + 告警"
      #     的完整链路,告警面板出现事件属正常。
      - "-Dloadtest.paths=/api/order/1,/api/trace-alert-demo/slow?ms=4000,/api/export/report?ms={rand:1000,4000},/debug,/longTimeTask,/api/deps-demo/grpc"
      - -DargLine=-Xmx512m
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  m2-cache:
