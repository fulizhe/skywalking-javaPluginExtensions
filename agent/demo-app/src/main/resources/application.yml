server:
  # 全仓库统一 9600;遵循 WebPort 环境变量约定(与 agent webhook 端口对齐)
  port: ${WebPort:9601}

# springfox/knife4j 2.x 需用 ant 路径匹配(Spring Boot 2.6+ 默认 PathPattern 会导致启动失败)
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:h2:mem:dbtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: "123456"
  sql:
    init:
      # 沿用旧 demo 工程的 h2 内存库,启动即建表灌数据(初学者 SQL 可观测演示)
      schema-locations: classpath:schema/schema.sql
      data-locations: classpath:schema/data.sql
  h2:
    console:
      enabled: true
      path: /h2

# 依赖拓扑演示(票 02/03):Cache / Database / MQ 三层造数目标。
#
# 刻意**独立前缀**,不碰 spring.datasource —— 让 Boot 用 MySQL 顶掉 H2 演示库会连带
# 打挂 schema.sql 灌数据与 /h2 控制台(NOTES 已记 H2 的既有坑)。
#
# **默认值 = 本机跑应用时的宿主映射端口**(compose 的 deps profile 把 6379/3306/9092
# 映射成 16379/13306/19092,避开本机常被别的栈占用的标准端口)。所以:
#   - 本机跑 jar(pwsh / run-with-agent.ps1 / demo.ps1):**什么都不用设**
#   - compose 里的 demo-app 容器:用服务名 redis:6379 / mysql:3306 / kafka:9092
#     (compose 的 environment 已经覆盖下面的默认值)
#   - 中间件不在场时端点**照调**,连不上即没有依赖边(不是红边),见 NOTES 第 15 条
deps:
  redis:
    host: ${DEPS_REDIS_HOST:localhost}
    port: ${DEPS_REDIS_PORT:16379}
  mysql:
    # connectTimeout/socketTimeout 直接写在 URL 上:JDBC 无 Spring Boot 那种属性覆盖,
    # 超时必须显式给,否则默认近乎无限,挂住即拖垮压测与页面轮询。
    url: "${DEPS_MYSQL_URL:jdbc:mysql://localhost:13306/demo?connectTimeout=2000&socketTimeout=3000}"
    username: ${DEPS_MYSQL_USER:root}
    password: ${DEPS_MYSQL_PASSWORD:}
  kafka:
    bootstrap: ${DEPS_KAFKA_BOOTSTRAP:localhost:19092}
    topic: ${DEPS_KAFKA_TOPIC:sw-demo}
  grpc:
    # RPC 样例:进程内 gRPC server 的端口(不引外部中间件,只占一个本机端口)
    port: ${DEPS_GRPC_PORT:9099}
  http:
    # 外呼白名单:演示端点不接受任意 URL(避免变成 SSRF 口子)。
    # 可达性取决于宿主网络 —— 不通就是红边,是预期不是故障。
    sites:
      httpbin: https://httpbin.org/get
      baidu: https://www.baidu.com/
      google: https://www.google.com/generate_204

