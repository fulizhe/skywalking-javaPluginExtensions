server:
  # 全仓库统一 9600;遵循 WebPort 环境变量约定(与 agent webhook 端口对齐)
  port: ${WebPort:9601}

# springfox/knife4j 2.x 需用 ant 路径匹配(Spring Boot 2.6+ 默认 PathPattern 会导致启动失败)
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:h2:mem:dbtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: "123456"
  sql:
    init:
      # 沿用旧 demo 工程的 h2 内存库,启动即建表灌数据(初学者 SQL 可观测演示)
      schema-locations: classpath:schema/schema.sql
      data-locations: classpath:schema/data.sql
  h2:
    console:
      enabled: true
      path: /h2

# 依赖拓扑演示(票 02/03):Cache / Database / MQ 三层造数目标。
#
# 刻意**独立前缀 + 环境变量兜底**,不碰 spring.datasource —— 让 Boot 用 MySQL 顶掉
# H2 演示库会连带打挂 schema.sql 灌数据与 h2 控制台(NOTES 已记 H2 的既有坑)。
# 容器内用 compose 服务名(docker compose --profile deps up),本机/verify 用 localhost:
#   DEPS_REDIS_HOST=redis / DEPS_MYSQL_URL=jdbc:mysql://mysql:3306/... / DEPS_KAFKA_BOOTSTRAP=kafka:9092
#
# 中间件不在场时端点**照调**,连不上会变成依赖图里的红边(错误率着色),不是"没有依赖"。
deps:
  redis:
    host: ${DEPS_REDIS_HOST:localhost}
    port: ${DEPS_REDIS_PORT:6379}
  mysql:
    # connectTimeout/socketTimeout 直接写在 URL 上:JDBC 无 Spring Boot 那种属性覆盖,
    # 超时必须显式给,否则默认近乎无限,挂住即拖垮压测与页面轮询。
    url: "${DEPS_MYSQL_URL:jdbc:mysql://localhost:3306/demo?connectTimeout=2000&socketTimeout=3000}"
    username: ${DEPS_MYSQL_USER:demo}
    password: ${DEPS_MYSQL_PASSWORD:demo}
  kafka:
    bootstrap: ${DEPS_KAFKA_BOOTSTRAP:localhost:9092}
    topic: ${DEPS_KAFKA_TOPIC:sw-demo}
  http:
    # 外呼白名单:演示端点不接受任意 URL(避免变成 SSRF 口子)。
    # 可达性取决于宿主网络 —— 不通就是红边,是预期不是故障。
    sites:
      httpbin: https://httpbin.org/get
      baidu: https://www.baidu.com/
      google: https://www.google.com/generate_204

