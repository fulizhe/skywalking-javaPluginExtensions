<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H2 链路查询（双源对照）</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 18px; }
  .row { margin: 8px 0; }
  input { width: 420px; padding: 6px 8px; font-family: monospace; }
  button { padding: 6px 12px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  th { background: #f5f5f5; }
  tr { cursor: pointer; }
  tr:hover { background: #eef; }
  pre { background: #f7f7f7; border: 1px solid #ddd; padding: 10px; overflow: auto; max-height: 60vh; }
  .expired { color: #b00; font-weight: bold; }
  .ok { color: #0a7a2f; font-weight: bold; }
  .warn { color: #b8860b; font-weight: bold; }
  .muted { color: #888; }
  .cols { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1 1 420px; min-width: 0; }
</style>
</head>
<body>
<h1>H2 链路查询 · 双源对照（H2 为准 vs 内存热层参照）</h1>
<div class="row">
  最近 <input id="limit" type="number" value="20" min="1" max="200" style="width:80px"> 条
  <button onclick="loadRecent()">刷新列表</button>
  <span id="recentMsg" class="muted"></span>
</div>
<table id="recentTable">
  <thead>
    <tr><th>traceId</th><th>segmentId</th><th>service</th><th>endpoint</th><th>startTime</th><th>latency(ms)</th><th>error</th><th>payload</th></tr>
  </thead>
  <tbody></tbody>
</table>

<div class="row">
  traceId: <input id="traceId" placeholder="点列表行自动填入，或手动粘贴">
  <button onclick="loadTrace()">双源对照</button>
  <a id="viewLink" href="trace-view.html" target="_blank" style="margin-left:8px">可视化视图 →</a>
</div>
<div id="traceMsg" class="muted"></div>
<div id="diffBox" style="margin:10px 0"></div>
<div class="cols">
  <div class="col">
    <div class="muted">H2（为准）· logs = <span id="h2Count">-</span><span id="h2Expired"></span></div>
    <pre id="traceDetail" style="display:none"></pre>
  </div>
  <div class="col">
    <div class="muted">内存热层（参照）· logs = <span id="memCount">-</span></div>
    <pre id="memoryDetail" style="display:none"></pre>
  </div>
</div>

<script>
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function fmtTime(ms) { if (!ms && ms !== 0) return "-"; return new Date(ms).toLocaleString(); }

function loadRecent() {
  var limit = document.getElementById("limit").value || 20;
  fetch("/inner/sw/trace-recent?limit=" + encodeURIComponent(limit))
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var tb = document.querySelector("#recentTable tbody");
      tb.innerHTML = "";
      document.getElementById("recentMsg").textContent = "共 " + rows.length + " 条";
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        tr.onclick = function () { document.getElementById("traceId").value = row.traceId; loadTrace(); };
        tr.innerHTML =
          "<td>" + esc(row.traceId) + "</td>" +
          "<td>" + esc(row.traceSegmentId) + "</td>" +
          "<td>" + esc(row.service) + "</td>" +
          "<td>" + esc(row.endpoint) + "</td>" +
          "<td>" + esc(fmtTime(row.startTime)) + "</td>" +
          "<td>" + esc(row.latency) + "</td>" +
          "<td>" + (row.isError ? "<span class='expired'>Y</span>" : "N") + "</td>" +
          "<td>" + (row.payloadExpired ? "<span class='expired'>过期</span>" : "OK") + "</td>";
        tb.appendChild(tr);
      });
    })
    .catch(function (e) { document.getElementById("recentMsg").textContent = "加载失败: " + e; });
}

function segKey(log) { return (log && log.traceSegmentId) ? log.traceSegmentId : "(no-id)"; }
function spanCount(log) { var s = log && log.spans; return s ? s.length : 0; }

/* 按 traceSegmentId 对齐两侧段列表，逐段标注：一致 / span 数不同 / 仅 H2 / 仅内存 */
function renderDiff(h2Logs, memLogs) {
  var box = document.getElementById("diffBox");
  if (!box) return;
  var h2 = {}, mem = {};
  h2Logs.forEach(function (l) { var k = segKey(l); (h2[k] = h2[k] || []).push(l); });
  memLogs.forEach(function (l) { var k = segKey(l); (mem[k] = mem[k] || []).push(l); });
  var ids = {}; Object.keys(h2).forEach(function (k) { ids[k] = 1; }); Object.keys(mem).forEach(function (k) { ids[k] = 1; });
  var keys = Object.keys(ids).sort();
  var both = 0, h2Only = 0, memOnly = 0, spanDiff = 0, rows = [];
  keys.forEach(function (k) {
    var a = h2[k] || [], b = mem[k] || [];
    var as = a.reduce(function (s, l) { return s + spanCount(l); }, 0);
    var bs = b.reduce(function (s, l) { return s + spanCount(l); }, 0);
    var status;
    if (a.length && b.length) { if (as === bs) { status = "both"; both++; } else { status = "span-diff"; spanDiff++; } }
    else if (a.length) { status = "h2-only"; h2Only++; }
    else { status = "mem-only"; memOnly++; }
    rows.push({ k: k, status: status, a: a.length, b: b.length, as: as, bs: bs });
  });
  var cls = { "both": "ok", "span-diff": "warn", "h2-only": "expired", "mem-only": "warn" };
  var head = "段对齐：共 " + keys.length + " 段 · 双侧一致 " + both
    + (spanDiff ? "（其中 span 数不同 " + spanDiff + "）" : "")
    + " · 仅 H2 " + h2Only + " · 仅内存 " + memOnly;
  var html = '<div class="muted" style="font-size:12.5px;margin-bottom:4px">' + head + '</div>'
    + '<table><thead><tr><th>traceSegmentId</th><th>H2 段</th><th>内存 段</th><th>H2 span</th><th>内存 span</th><th>状态</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    html += '<tr><td class="mono">' + esc(r.k) + '</td><td>' + r.a + '</td><td>' + r.b + '</td><td>' + r.as + '</td><td>' + r.bs + '</td>'
      + '<td class="' + cls[r.status] + '">' + r.status + '</td></tr>';
  });
  html += '</tbody></table>';
  box.innerHTML = keys.length ? html : '<div class="muted">无可对齐的段</div>';
}

function loadTrace() {
  var traceId = document.getElementById("traceId").value.trim();
  if (!traceId) { document.getElementById("traceMsg").textContent = "请输入 traceId"; return; }
  document.getElementById("viewLink").href = "trace-view.html?traceid=" + encodeURIComponent(traceId);
  var q = encodeURIComponent(traceId);
  Promise.all([
    fetch("/inner/sw/trace-query?traceId=" + q).then(function (r) { return r.json(); }),
    fetch("/inner/sw/trace-memory?traceId=" + q).then(function (r) { return r.json(); })
  ]).then(function (res) {
    var h2 = res[0] || {}, mem = res[1] || {};
    var h2Logs = h2.logs || [], memLogs = mem.logs || [];
    document.getElementById("h2Count").textContent = h2Logs.length;
    document.getElementById("memCount").textContent = memLogs.length;
    document.getElementById("h2Expired").innerHTML = h2.payloadExpired
      ? " <span class='expired'>（部分 payload 已过期）</span>" : "";
    var same = h2Logs.length === memLogs.length;
    document.getElementById("traceMsg").innerHTML = same
      ? "<span class='ok'>一致：H2 与内存 logs 条数相同（" + h2Logs.length + "）</span>"
      : "<span class='expired'>差异：H2=" + h2Logs.length + " vs 内存=" + memLogs.length
        + "（内存热层只保最近 N 条 traceId，可能已淘汰该 trace；以 H2 为准）</span>";
    renderDiff(h2Logs, memLogs);
    var pre = document.getElementById("traceDetail");
    pre.style.display = "block";
    pre.textContent = JSON.stringify(h2, null, 2);
    var pre2 = document.getElementById("memoryDetail");
    pre2.style.display = "block";
    pre2.textContent = JSON.stringify(mem, null, 2);
  }).catch(function (e) { document.getElementById("traceMsg").textContent = "查询失败: " + e; });
}

loadRecent();
</script>
</body>
</html>
