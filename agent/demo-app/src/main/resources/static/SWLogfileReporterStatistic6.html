<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JVM 实例属性</title>
    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="./lib/bootstrap.min.css">
    <style>
        body {
            background: #fff;
            color: #222;
        }
        .dashboard-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #222;
        }
        .card {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e5e6eb;
        }
        .table th, .table td {
            vertical-align: middle;
            word-break: break-all;
        }
        .table th {
            white-space: nowrap;
            color: #555;
            font-weight: 500;
            background: #f7f7fa;
        }
        .table td {
            background: #fff;
        }
        .no-data, .error-msg {
            color: #888;
            text-align: center;
            padding: 2rem 0;
        }
        .error-msg {
            color: #d9534f;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="dashboard-title">JVM 实例属性</div>
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div id="dataArea">
                        <div class="no-data">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- jQuery -->
<script src="./lib/jquery.min.js"></script>
<!-- Bootstrap JS -->
<script src="./lib/bootstrap.bundle.min.js"></script>
<script>
// 工具函数：格式化 value
function renderValue(val) {
    if (val === null || val === undefined) return '—';
    if (Array.isArray(val)) {
        if (val.length === 0) return '<span style="color:#888">[]</span>';
        // 多行显示
        return '<ul style="margin-bottom:0;padding-left:1.2em;">' + val.map(v => '<li>' + renderValue(v) + '</li>').join('') + '</ul>';
    }
    if (typeof val === 'object') {
        // 对象类型友好显示
        return '<pre style="margin-bottom:0;">' + JSON.stringify(val, null, 2) + '</pre>';
    }
    // 其他类型直接显示
    return String(val);
}

function renderTable(data) {
    let html = '<table class="table table-bordered table-sm mb-0">';
    html += '<tbody>';
    Object.keys(data).forEach(key => {
        html += '<tr>';
        html += '<th>' + key + '</th>';
        html += '<td>' + renderValue(data[key]) + '</td>';
        html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

function showError(msg) {
    $('#dataArea').html('<div class="error-msg">' + msg + '</div>');
}
function showNoData() {
    $('#dataArea').html('<div class="no-data">暂无数据</div>');
}

$(function() {
    $.ajax({
        url: './statisticInstanceProperties',
        method: 'GET',
        dataType: 'json',
        timeout: 8000,
        success: function(data) {
            if (!data || Object.keys(data).length === 0) {
                showNoData();
                return;
            }
            $('#dataArea').html(renderTable(data));
        },
        error: function() {
            showError('数据加载失败，请检查网络或后端接口');
        }
    });
});
</script>
</body>
</html>
