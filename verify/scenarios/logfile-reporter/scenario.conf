# logfile-reporter 场景声明。被 verify/run-scenario.sh source;变量见该脚本头部注释。
# 断言与 agent/demo-app/scripts/validate.ps1 的 A/B/C/D 等价(见同目录 checks.sh)。

PLUGIN_MODULES="logfile-reporter-plugin"
PLUGIN_JAR_GLOBS="logfile-reporter-plugin/target/logfile-reporter-plugin-*.jar"
PLUGIN_LOAD_REGEX="logfile-reporter-plugin-[0-9.]+\.jar loaded"
HEALTH_PATH="/"
REMOVE_OFFICIAL_HTTPCLIENT="false"

# 与 validate.ps1 启动参数一致(alert 规则/豁免规则逐字相同)
AGENT_OPTS="-Dskywalking.agent.keep_tracing=true \
-Dskywalking.plugin.logfilereporter.alert.enabled=true \
-Dskywalking.plugin.logfilereporter.alert.slow_rules=operation:GET:/status/*=8000;operation:GET:/api/order/*=8000;operation:GET:/api/export/**=60000 \
-Dskywalking.plugin.logfilereporter.alert.error_ignore_rules=operation:GET:/.well-known/**=404;operation:GET:/status/*=503,500,400;operation:GET:/api/exists/*=404;operation:GET:/inner/business-test/**=404,410"
