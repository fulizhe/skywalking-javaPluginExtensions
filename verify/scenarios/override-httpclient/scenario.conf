# override-httpclient 场景声明。
# 目标:验证运行时开关 + "httpclient POST 表单体被采为 http.request.params tag" 端到端;
# 并对 support-version.list 里的 httpclient 4.5.x 版本跑矩阵(证明跨版本增强可用)。
# logfile-reporter 同时装载,作为 span/tag 的读取面(override 插件自身不提供数据读口)。

PLUGIN_MODULES="override-httpclient-4.x-plugin,logfile-reporter-plugin"
PLUGIN_JAR_GLOBS="override-httpclient-4.x-plugin/target/override-apm-httpclient-4.x-plugin-*.jar logfile-reporter-plugin/target/logfile-reporter-plugin-*.jar"
PLUGIN_LOAD_REGEX="override-apm-httpclient-4.x-plugin-[0-9.]+\.jar loaded"
HEALTH_PATH="/"
# 版本矩阵注入 demo-app 的 maven 属性(见 agent/demo-app/pom.xml 的 <httpclient.version>)
MATRIX_PROPERTY="httpclient.version"
# 官方 apm-httpClient-4.x-plugin 与 override 插件同源增强同一批类,停用官方以避免重复增强。
REMOVE_OFFICIAL_PLUGINS="apm-httpClient-4.x-plugin-*.jar"

AGENT_OPTS="-Dskywalking.agent.keep_tracing=true \
-Dskywalking.plugin.httpclient.collect_http_params=true \
-Dskywalking.plugin.overridehttpclient.collect_http_params=true"
