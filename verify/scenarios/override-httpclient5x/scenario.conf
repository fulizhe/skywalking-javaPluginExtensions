# override-httpclient5x 场景声明。
# 目标:验证运行时开关 + "httpclient5 POST 表单体被采为 http.request.params tag" 端到端;
# 并对 support-version.list 里的 httpclient5 版本跑矩阵(证明跨 5.x 版本增强可用)。
# logfile-reporter 同时装载,作为 span/tag 的读取面(override 插件自身不提供数据读口)。

PLUGIN_MODULES="override-httpclient-5.x-plugin,logfile-reporter-plugin"
PLUGIN_JAR_GLOBS="override-httpclient-5.x-plugin/target/override-apm-httpclient-5.x-plugin-*.jar logfile-reporter-plugin/target/logfile-reporter-plugin-*.jar"
PLUGIN_LOAD_REGEX="override-apm-httpclient-5.x-plugin-[0-9.]+\.jar loaded"
HEALTH_PATH="/"
# 版本矩阵注入 demo-app 的 maven 属性(见 agent/demo-app/pom.xml 的 <httpclient5.version>)
MATRIX_PROPERTY="httpclient5.version"
# override 插件已整包替代官方 5.x 插件(同步加采集、异步原样保留),移除官方 jar 避免同步路径双重增强。
REMOVE_OFFICIAL_PLUGINS="apm-httpclient-5.x-plugin-*.jar"

AGENT_OPTS="-Dskywalking.agent.keep_tracing=true \
-Dskywalking.plugin.httpclient.collect_http_params=true \
-Dskywalking.plugin.overridehttpclient5.collect_http_params=true"
