# override-hutool 场景声明。
# 目标:覆盖 override-hutool-http-5.x-plugin 的四类采集面(query / 表单体 / 原始体 / multipart 文件)
# + http.response.body 采集 + 错误状态,并证明:
#   1) 采集开关(与 override-httpclient 共享)可读、可运行时切换;
#   2) 开关关断后 span 仍在、参数 tag 消失(监控不改变链路结构);
#   3) 插件采集响应体的同时,业务侧仍能完整读到 body(监控不阻碍业务)。
# logfile-reporter 同时装载,作为 span/tag 的读取面;override-httpclient 一并装载 ——
# hutool 插件不自带读口,其运行时开关入口是共用的 SWHttpClientCollectUtils(见插件 README)。

PLUGIN_MODULES="override-hutool-http-5.x-plugin,override-httpclient-4.x-plugin,logfile-reporter-plugin"
PLUGIN_JAR_GLOBS="override-hutool-http-5.x-plugin/target/override-apm-hutool-http-5.x-plugin-*.jar override-httpclient-4.x-plugin/target/override-apm-httpclient-4.x-plugin-*.jar logfile-reporter-plugin/target/logfile-reporter-plugin-*.jar"
PLUGIN_LOAD_REGEX="override-apm-hutool-http-5.x-plugin-[0-9.]+\.jar loaded"
HEALTH_PATH="/"
# 版本矩阵注入 demo-app 的 maven 属性(见 agent/demo-app/pom.xml 的 <hutool.version>)
MATRIX_PROPERTY="hutool.version"
# 官方 httpClient 4.x 插件与本仓 override 插件同源增强同一批类,停用官方以避免重复增强。
# 官方 hutool 插件在发行包的 optional-plugins/(默认不激活),无需移除。
REMOVE_OFFICIAL_PLUGINS="apm-httpClient-4.x-plugin-*.jar"

AGENT_OPTS="-Dskywalking.agent.keep_tracing=true \
-Dskywalking.plugin.httpclient.collect_http_params=true \
-Dskywalking.plugin.overridehttpclient.collect_http_params=true"
